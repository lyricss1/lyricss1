<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" width="1000" height="220" role="img" aria-label="lyricss - C, ASM, ARM">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f14"/>
      <stop offset="1" stop-color="#0f1722"/>
    </linearGradient>
    <linearGradient id="fade" gradientUnits="userSpaceOnUse" x1="530" y1="0" x2="650" y2="0">
      <stop offset="0" stop-color="#000"/>
      <stop offset="1" stop-color="#fff"/>
    </linearGradient>
    <mask id="m" maskUnits="userSpaceOnUse" x="0" y="0" width="1000" height="220">
      <rect width="1000" height="220" fill="url(#fade)"/>
    </mask>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4fd1c5"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: "JetBrains Mono", "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
    .dim   { fill: #3d4b5c; }
    .blue  { fill: #3b82f6; }
    .acc   { fill: #4fd1c5; }
    .name  { fill: #e6edf3; font-size: 64px; font-weight: 700; }
    .sub   { fill: #4fd1c5; font-size: 15px; letter-spacing: 2.5px; }
    .prompt{ fill: #6b7a8c; font-size: 14px; }
    .code  { font-size: 13px; }
    .cur   { fill: #4fd1c5; animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>

  <rect width="1000" height="220" rx="12" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="999" height="219" rx="12" fill="none" stroke="#1f2a37"/>
  <rect x="0" y="28" width="4" height="164" rx="2" fill="url(#bar)"/>
  <g class="code" opacity="0.9" mask="url(#m)">
    <text y="40"><tspan x="560" class="dim">0000</tspan><tspan x="610" class="blue">7f 45 4c 46 02 01 01 00</tspan></text>
    <text y="60"><tspan x="560" class="dim">0010</tspan><tspan x="610" class="blue">03 00 b7 00 01 00 00 00</tspan></text>
    <text y="80"><tspan x="560" class="dim">0018</tspan><tspan x="610" class="blue">40 06 00 00 00 00 00 00</tspan></text>
    <text y="116"><tspan x="560" class="dim">0640</tspan><tspan x="610" class="blue">fd 7b bf a9</tspan><tspan x="715" class="acc">stp  x29, x30, [sp, -0x10]!</tspan></text>
    <text y="136"><tspan x="560" class="dim">0644</tspan><tspan x="610" class="blue">fd 03 00 91</tspan><tspan x="715" class="acc">mov  x29, sp</tspan></text>
    <text y="156"><tspan x="560" class="dim">0648</tspan><tspan x="610" class="blue">00 00 80 52</tspan><tspan x="715" class="acc">mov  w0, 0</tspan></text>
    <text y="176"><tspan x="560" class="dim">064c</tspan><tspan x="610" class="blue">fd 7b c1 a8</tspan><tspan x="715" class="acc">ldp  x29, x30, [sp], 0x10</tspan></text>
    <text y="196"><tspan x="560" class="dim">0650</tspan><tspan x="610" class="blue">c0 03 5f d6</tspan><tspan x="715" class="acc">ret</tspan></text>
  </g>
  <text x="60" y="72" class="prompt">$ r2 -a arm -b 64 -A lyricss</text>
  <text x="56" y="140" class="name">lyricss<tspan class="cur">_</tspan></text>
  <text x="60" y="180" class="sub">C · ASM · ARM</text>
</svg>